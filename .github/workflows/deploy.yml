name: Deploy a servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar llave SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Quita saltos de línea de Windows / espacios finales y asegura salto final
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::El secret SSH_KEY no es una llave privada válida. Vuelve a copiarla completa (desde -----BEGIN hasta END-----)."
            exit 1
          fi
          echo "Huella de la llave (comparar con el servidor):"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "$(echo '${{ secrets.SSH_HOST }}' | tr -d '[:space:]')" >> ~/.ssh/known_hosts

      - name: Copiar sitio al servidor
        env:
          RAW_USER: ${{ secrets.SSH_USER }}
          RAW_HOST: ${{ secrets.SSH_HOST }}
        run: |
          SSH_USER="$(echo "$RAW_USER" | tr -d '[:space:]')"
          SSH_HOST="$(echo "$RAW_HOST" | tr -d '[:space:]')"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'deploy' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ "${SSH_USER}@${SSH_HOST}:/var/www/masoterapiadiana.cl/"
